<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phone camera</title>
<style>
  :root { color-scheme: dark; }
  body { background: #101418; color: #e8edf2; font: 17px system-ui, sans-serif; margin: 0 auto; max-width: 640px; padding: 16px; }
  #go { background: #1f7a5c; border: 0; border-radius: 10px; color: #fff; font: inherit; font-weight: 600; padding: 16px; width: 100%; }
  #go:disabled { opacity: .5; }
  #view { background: #000; border-radius: 10px; display: block; margin: 12px 0; width: 100%; }
  #note { color: #9fb0bf; }
</style>
<button id="go">Start the camera</button>
<video id="view" autoplay muted playsinline></video>
<p id="note">Tap, then allow the camera.</p>
<script>
// One frame in flight at a time, so a slow link loses frames and never builds a queue. The phone keeps nothing.
const SIZE = [640, 360], PAUSE_MS = 50, JPEG_QUALITY = 0.7;
const view = document.querySelector("#view"), note = document.querySelector("#note"), go = document.querySelector("#go");
const sheet = Object.assign(document.createElement("canvas"), { width: SIZE[0], height: SIZE[1] });
let sound, sent = 0;

const beep = () => {
  const tone = sound.createOscillator(), level = sound.createGain(), now = sound.currentTime;
  tone.frequency.value = 880;
  level.gain.setValueAtTime(0.25, now);
  level.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
  tone.connect(level).connect(sound.destination);
  tone.start();
  tone.stop(now + 0.25);
};
const say = (words) => {
  speechSynthesis.cancel();
  speechSynthesis.speak(new SpeechSynthesisUtterance(words));
};

function followAgent() {
  new EventSource("/events").onmessage = ({ data }) => {
    const event = JSON.parse(data);
    if (event.kind === "chime") beep();
    if (event.kind === "voice") say(event.text || "hand");
  };
}

async function postFrames() {
  for (;;) {
    try {
      sheet.getContext("2d").drawImage(view, 0, 0, ...SIZE);
      const jpeg = await new Promise((done) => sheet.toBlob(done, "image/jpeg", JPEG_QUALITY));
      await fetch("/frame", { method: "POST", headers: { "Content-Type": "image/jpeg" }, body: jpeg });
      note.textContent = `Streaming, ${++sent} frames sent.`;
      await new Promise((done) => setTimeout(done, PAUSE_MS));
    } catch (failure) {
      note.textContent = `Couldn't send a frame, trying again: ${failure.message}`;
      await new Promise((done) => setTimeout(done, 1000));
    }
  }
}

async function begin() {
  // iOS unlocks sound and speech only inside a tap.
  sound = new (window.AudioContext || window.webkitAudioContext)();
  sound.resume();
  say(" ");
  try {
    view.srcObject = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: "environment" }, width: { ideal: SIZE[0] }, height: { ideal: SIZE[1] } },
    });
    await view.play();
  } catch (failure) {
    note.textContent = `The camera was refused: ${failure.message}`;
    return;
  }
  navigator.wakeLock?.request("screen").catch(() => {});
  go.disabled = true;
  followAgent();
  postFrames();
}

go.addEventListener("click", begin);
</script>
