<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#f6f3ee"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <rect x="64" y="64" width="232" height="40" rx="20" fill="#fff4dc"/>
    <text x="180" y="91" font-size="20" font-weight="700" fill="#8a5a00" text-anchor="middle" letter-spacing="1.5">SIMULATED BABY</text>
    <text x="64" y="196" font-size="72" font-weight="800" fill="#1f2328">Theo's agent</text>
    <text x="64" y="262" font-size="40" font-weight="500" fill="#6b6f76">a simulated baby, a live agent</text>
    <text x="64" y="350" font-size="28" fill="#1f2328">Ask why he is crying. Log a bottle.</text>
    <text x="64" y="392" font-size="28" fill="#1f2328">See who is up next tonight. Pack the bag.</text>
    <text x="64" y="560" font-size="24" font-weight="600" fill="#2f6f5e">baby.bygmv.com</text>
    <text x="64" y="594" font-size="20" fill="#6b6f76">Brain: Muse Spark Open, Meta's open model. Never medical advice.</text>
    <g transform="translate(760 70)">
      <rect width="380" height="490" rx="36" fill="#ffffff" stroke="#e6e0d6" stroke-width="2"/>
      <rect x="24" y="28" width="156" height="104" rx="16" fill="#f6f3ee"/>
      <text x="40" y="58" font-size="14" font-weight="700" fill="#6b6f76" letter-spacing="1">NEXT FEED</text>
      <text x="40" y="106" font-size="40" font-weight="800" fill="#1f2328">03:10</text>
      <rect x="200" y="28" width="156" height="104" rx="16" fill="#f6f3ee"/>
      <text x="216" y="58" font-size="14" font-weight="700" fill="#6b6f76" letter-spacing="1">UP NEXT</text>
      <text x="216" y="104" font-size="28" font-weight="800" fill="#1f2328">Parent B</text>
      <rect x="24" y="156" width="250" height="44" rx="18" fill="#2f6f5e"/>
      <text x="44" y="185" font-size="19" fill="#ffffff">Why is he crying?</text>
      <rect x="24" y="220" width="332" height="150" rx="18" fill="#ffffff" stroke="#e6e0d6" stroke-width="2"/>
      <text x="44" y="256" font-size="19" fill="#1f2328">Probably hungry: the last</text>
      <text x="44" y="284" font-size="19" fill="#1f2328">feed was 2 h 40 min ago and</text>
      <text x="44" y="312" font-size="19" fill="#1f2328">feeds come about every 2 h.</text>
      <text x="44" y="346" font-size="16" fill="#6b6f76">A guess from the log, never a diagnosis.</text>
      <rect x="24" y="392" width="240" height="34" rx="10" fill="#fff4dc"/>
      <text x="40" y="415" font-size="16" fill="#8a5a00">Simulated house: dim lights</text>
      <text x="24" y="466" font-size="15" fill="#6b6f76">Illustration, numbers vary per visit</text>
    </g>
  </g>
</svg>
