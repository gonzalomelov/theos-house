<svg xmlns="http://www.w3.org/2000/svg" color="#1C2630" style="background:#fff" viewBox="0 0 900 556" role="img" aria-label="All the pieces of the agent, coloured by whether they run today."><style>text{font-family:Helvetica,Arial,sans-serif;fill:#1C2630}.t{font-size:12.5px;font-weight:600}.s{font-size:11px;fill:#5B6874}.lb{font-size:11px}.lbk{fill:#B8641C;font-weight:600}.zt{font-size:11px;fill:#5B6874}.z{fill:none;stroke:#D9DFE5;stroke-width:1.5}.l{stroke:#1C2630;stroke-width:1.2;fill:none}.lk{stroke:#B8641C;stroke-width:2;fill:none}.ll{stroke:#5B6874}.sd{fill:#DDEBE3;stroke:#2F7A4F;stroke-width:1.5}.sp{fill:#F1E8D2;stroke:#9A6A00;stroke-width:1.5}</style><defs><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="a4k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="kf" d="M0 0L10 5L0 10z"/></marker></defs><rect class="z" x="20" y="24" width="860" height="84" rx="8"/><text class="zt" x="30" y="40">What wakes the agent</text><rect class="sd" x="36" y="48" width="200" height="48" rx="6"/><text class="t" x="136.0" y="69.0" text-anchor="middle">Home Assistant</text><text class="s" x="136.0" y="84.0" text-anchor="middle">state changes, WebSocket</text><rect class="sd" x="246" y="48" width="200" height="48" rx="6"/><text class="t" x="346.0" y="69.0" text-anchor="middle">Schedule</text><text class="s" x="346.0" y="84.0" text-anchor="middle">only wakes Muse</text><rect class="sd" x="456" y="48" width="200" height="48" rx="6"/><text class="t" x="556.0" y="69.0" text-anchor="middle">Parents and Grandma</text><text class="s" x="556.0" y="84.0" text-anchor="middle">Telegram, Echo</text><rect class="sd" x="666" y="48" width="198" height="48" rx="6"/><text class="t" x="765.0" y="69.0" text-anchor="middle">Event simulator</text><text class="s" x="765.0" y="84.0" text-anchor="middle">same path as real events</text><line class="lk" x1="450" y1="110" x2="450" y2="132" marker-end="url(#a4k)"/><rect class="z" x="20" y="134" width="860" height="142" rx="8"/><text class="zt" x="30" y="150">The agent: the same code on both sides</text><rect class="sd" x="36" y="158" width="200" height="48" rx="6"/><text class="t" x="136.0" y="179.0" text-anchor="middle">LangGraph</text><text class="s" x="136.0" y="194.0" text-anchor="middle">Python, runs the loop</text><rect class="sd" x="246" y="158" width="410" height="48" rx="6"/><text class="t" x="451.0" y="179.0" text-anchor="middle">Muse Spark Open on Baseten</text><text class="s" x="451.0" y="194.0" text-anchor="middle">decides every step through tools</text><rect class="sd" x="666" y="158" width="198" height="48" rx="6"/><text class="t" x="765.0" y="179.0" text-anchor="middle">PostgreSQL</text><text class="s" x="765.0" y="194.0" text-anchor="middle">memory, events, actions</text><rect class="sd" x="36" y="216" width="200" height="48" rx="6"/><text class="t" x="136.0" y="237.0" text-anchor="middle">No fixed routines</text><text class="s" x="136.0" y="252.0" text-anchor="middle">no message templates</text><rect class="sd" x="246" y="216" width="200" height="48" rx="6"/><text class="t" x="346.0" y="237.0" text-anchor="middle">Red flags</text><text class="s" x="346.0" y="252.0" text-anchor="middle">in code, before Muse</text><rect class="sd" x="456" y="216" width="200" height="48" rx="6"/><text class="t" x="556.0" y="237.0" text-anchor="middle">Allow list</text><text class="s" x="556.0" y="252.0" text-anchor="middle">only listed devices move</text><rect class="sd" x="666" y="216" width="198" height="48" rx="6"/><text class="t" x="765.0" y="237.0" text-anchor="middle">Multi-day tests</text><text class="s" x="765.0" y="252.0" text-anchor="middle">and 42 simulated days</text><line class="lk" x1="450" y1="278" x2="450" y2="296" marker-end="url(#a4k)"/><rect class="sd" x="20" y="298" width="860" height="42" rx="6"/><text class="t" x="450.0" y="316.0" text-anchor="middle">One tool layer</text><text class="s" x="450.0" y="331.0" text-anchor="middle">real or mock, by one setting</text><line class="lk" x1="240" y1="342" x2="240" y2="362" marker-end="url(#a4k)"/><text class="lb lbk" x="256" y="356" text-anchor="start">real</text><line class="l" x1="700" y1="342" x2="700" y2="362" marker-end="url(#a4)"/><text class="lb" x="716" y="356" text-anchor="start">mock</text><rect class="z" x="20" y="364" width="500" height="166" rx="8"/><text class="zt" x="30" y="380">Our home, on the Vostro</text><rect class="sd" x="36" y="388" width="150" height="48" rx="6"/><text class="t" x="111.0" y="409.0" text-anchor="middle">Home Assistant</text><text class="s" x="111.0" y="424.0" text-anchor="middle">MCP, plugs, sensor</text><rect class="sd" x="196" y="388" width="150" height="48" rx="6"/><text class="t" x="271.0" y="409.0" text-anchor="middle">Baby Buddy</text><text class="s" x="271.0" y="424.0" text-anchor="middle">simulated Theo</text><rect class="sd" x="356" y="388" width="150" height="48" rx="6"/><text class="t" x="431.0" y="409.0" text-anchor="middle">Telegram, Echo</text><text class="s" x="431.0" y="424.0" text-anchor="middle">real, both heard</text><rect class="sp" x="36" y="446" width="150" height="72" rx="6"/><text class="t" x="111.0" y="479.0" text-anchor="middle">Hearing</text><text class="s" x="111.0" y="494.0" text-anchor="middle">real microphone</text><text class="s" x="111" y="508" text-anchor="middle">one test so far</text><rect class="sp" x="196" y="446" width="150" height="72" rx="6"/><text class="t" x="271.0" y="479.0" text-anchor="middle">SAM 3.1</text><text class="s" x="271.0" y="494.0" text-anchor="middle">recordings only</text><text class="s" x="271" y="508" text-anchor="middle">table partly, bath no</text><rect class="sp" x="356" y="446" width="150" height="72" rx="6"/><text class="t" x="431.0" y="479.0" text-anchor="middle">WhatsApp</text><text class="s" x="431.0" y="494.0" text-anchor="middle">receives only</text><text class="s" x="431" y="508" text-anchor="middle">Meta restricts sending</text><rect class="z" x="560" y="364" width="320" height="166" rx="8"/><text class="zt" x="570" y="380">For judges, simulator.bygmv.com</text><rect class="sd" x="576" y="388" width="288" height="40" rx="6"/><text class="t" x="720.0" y="405.0" text-anchor="middle">Mock home</text><text class="s" x="720.0" y="420.0" text-anchor="middle">same tools as the real one</text><rect class="sd" x="576" y="434" width="288" height="40" rx="6"/><text class="t" x="720.0" y="451.0" text-anchor="middle">Mock phones and log</text><text class="s" x="720.0" y="466.0" text-anchor="middle">one private home per visitor</text><rect class="sd" x="576" y="480" width="288" height="40" rx="6"/><text class="t" x="720.0" y="497.0" text-anchor="middle">Car seat recording</text><text class="s" x="720.0" y="512.0" text-anchor="middle">labelled as a recording</text><line class="ll" x1="540" y1="364" x2="540" y2="530" stroke-dasharray="5 4" /><text class="lb" x="540" y="546" text-anchor="middle">no route to the home</text></svg>