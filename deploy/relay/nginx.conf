# The agent's only way to Baby Buddy and Home Assistant. This container joins their networks, the agent
# does not, so the agent reaches exactly these two services and nothing else on them.
# One way in: Home Assistant asks the agent's voice bridge on 8767 (the Echo path), two paths only, bearer token
# checked by the agent.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 128; }

http {
  access_log off;
  server_tokens off;
  client_max_body_size 1m;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # Docker's DNS, asked again every 10 s so a restarted Baby Buddy or Home Assistant is found.
  resolver 127.0.0.11 valid=10s ipv6=off;

  proxy_http_version 1.1;
  proxy_set_header X-Forwarded-For "";
  proxy_read_timeout 60s;

  # Baby Buddy accepts only the hosts it was started with (ALLOWED_HOSTS=127.0.0.1,localhost).
  server {
    listen 8790;
    location / {
      set $babybuddy babybuddy:8000;
      proxy_set_header Host 127.0.0.1:8790;
      proxy_set_header Connection "";
      proxy_pass http://$babybuddy;
    }
  }

  # Home Assistant, REST and the websocket API.
  server {
    listen 8123;
    location / {
      set $homeassistant homeassistant:8123;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $http_connection;
      proxy_pass http://$homeassistant;
    }
  }

  # Home Assistant's one way in: a question said to the Echo goes to the agent's voice bridge, its answer comes back.
  server {
    listen 8767;
    location ~ ^/(ask|health)$ {
      set $agent parenting-agent:8767;
      proxy_set_header Connection "";
      proxy_pass http://$agent;
    }
    location / {
      return 404;
    }
  }
}
