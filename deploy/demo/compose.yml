# Parenting agent public demo on the Vostro, at https://baby.bygmv.com. Deployed by deploy/public.sh demo deploy.
#
#   docker network create --internal --ipv6=false \
#     -o com.docker.network.bridge.gateway_mode_ipv4=isolated pa-demo-internal
#   docker compose --env-file ~/apps/pa-demo.env -f deploy/demo/compose.yml up -d --build
#
# The wall: `demo` sits only on an internal network with no gateway and no host address. It can reach the
# egress proxy and the edge, nothing else: not the host, not Home Assistant, not Baby Buddy, not the LAN.
# The proxy allows HTTPS CONNECT only to the brain hosts in egress/filter. The env file holds two lines,
# ANTHROPIC_API_KEY (or BASETEN_API_KEY) and PA_DEMO_INTERNAL_SECRET, and nothing else. No host networking, ever.
name: pa-demo

x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "3" }

services:
  demo:
    <<: *hardened
    image: pa-demo:${APP_TAG:-latest}
    build:
      context: ../..
      dockerfile: deploy/demo/Dockerfile
    container_name: pa-demo
    networks: [internal]
    depends_on: [egress]
    environment:
      # Muse Spark Open on Baseten is the brain. Claude answers only when a Muse call errors, logged as brain_fallback.
      BASETEN_API_KEY: ${BASETEN_API_KEY:?set BASETEN_API_KEY in the env file}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in the env file}
      PA_DEMO_BRAIN: ${PA_DEMO_BRAIN:-baseten}
      PA_DEMO_DAILY_USD: ${PA_DEMO_DAILY_USD:-2}
      PA_DEMO_INTERNAL_SECRET: ${PA_DEMO_INTERNAL_SECRET:?set PA_DEMO_INTERNAL_SECRET in the env file}
      HTTPS_PROXY: http://egress:8888
      NO_PROXY: localhost,127.0.0.1
    volumes:
      - ${PA_DEMO_DATA:-${HOME}/apps/pa-demo-data}:/data
    tmpfs: ["/tmp:rw,size=16m"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 1
    pids_limit: 128

  egress:
    <<: *hardened
    image: pa-demo-egress:${APP_TAG:-latest}
    build: { context: ./egress }
    container_name: pa-demo-egress
    networks: [internal, egress]
    tmpfs: ["/tmp:rw,size=8m", "/run/tinyproxy:rw,size=1m,uid=100,gid=101"]
    mem_limit: 64m
    pids_limit: 64

  edge:
    <<: *hardened
    # A tiny TCP relay so the internal network never gets a published port.
    # alpine/socat:1.8.0.0 pinned by digest (2026-10-28). Bump deliberately.
    image: alpine/socat@sha256:a6be4c0262b339c53ddad723cdd178a1a13271e1137c65e27f90a08c16de02b8
    container_name: pa-demo-edge
    command: ["TCP-LISTEN:8080,fork,reuseaddr", "TCP:pa-demo:8765"]
    networks: [internal, edge]
    ports: ["127.0.0.1:${PA_DEMO_EDGE_PORT:-4820}:8080"]
    mem_limit: 32m
    pids_limit: 64

networks:
  internal:
    external: true
    name: pa-demo-internal
  egress:
    driver: bridge
  edge:
    driver: bridge
