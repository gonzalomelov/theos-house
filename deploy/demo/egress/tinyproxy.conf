# Forward proxy for the demo container. Default deny.
Port 8888
Listen 0.0.0.0
Timeout 120
MaxClients 20
LogLevel Notice
DisableViaHeader Yes
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16
ConnectPort 443
Filter "/etc/tinyproxy/filter"
FilterType ere
FilterDefaultDeny Yes
FilterCaseSensitive Off
