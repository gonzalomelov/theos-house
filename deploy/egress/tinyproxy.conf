# Forward proxy for the agent container. Default deny.
Port 8888
Listen 0.0.0.0
# Telegram long polling holds a request open for up to a minute.
Timeout 600
MaxClients 20
LogLevel Notice
DisableViaHeader Yes

# Only the containers on the agent's internal network may use it.
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16

# Only HTTPS tunnels, and only to the hosts in the filter file.
ConnectPort 443
Filter "/etc/tinyproxy/filter"
FilterType ere
FilterDefaultDeny Yes
FilterCaseSensitive Off
