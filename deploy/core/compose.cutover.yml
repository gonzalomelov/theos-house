# Cutover, Gonza's call: the core takes over from the old agent. Laid over compose.yml by CUTOVER=1 sh deploy/core.sh deploy, which
# refuses while the old agent runs. Telegram, the Echo and the baby log become real, and PA_ALLOWED_DEVICES then says which plugs move.
# The alias is how Home Assistant's one way in keeps working: the relay forwards 8767 to the name parenting-agent, and only the core
# answers to it once the old agent is stopped.
services:
  core:
    networks:
      walled:
        aliases: [parenting-agent]
      db: {}
    environment:
      PA_CHANNEL: real
      PA_LOG: real
      PA_TELEGRAM_POLL: "1"
      PA_REHEARSAL: ${PA_REHEARSAL:-1}
      PA_SIM_THEO: "1"
      PA_ECHO_PORT: "8767"
      PA_VOICE_SERVICE: http://pa-voice-family:8800
      PA_BABY_CHILD: ${PA_BABY_CHILD:-test-baby}
      BABYBUDDY_URL: http://parenting-agent-relay:8790
      BABYBUDDY_TOKEN: ${BABYBUDDY_TOKEN}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TELEGRAM_CECI_CHAT_ID: ${TELEGRAM_CECI_CHAT_ID}
      PARENTING_AGENT_VOICE_TOKEN: ${PARENTING_AGENT_VOICE_TOKEN}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_GONZA: ${WHATSAPP_GONZA:-}
      WHATSAPP_CECI: ${WHATSAPP_CECI:-}
      WHATSAPP_TEMPLATE: ${WHATSAPP_TEMPLATE:-}

  whatsapp-door:
    # The same pinned image as the relay and the Alexa skill's door. Nothing reaches it until a tunnel hostname points at the port.
    image: nginxinc/nginx-unprivileged@sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6
    container_name: parenting-whatsapp-door
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [door]
    ports: ["127.0.0.1:4831:8080"]
    volumes:
      - ./whatsapp-door.conf:/etc/nginx/nginx.conf:ro
    tmpfs:
      - /tmp:rw,size=8m
    mem_limit: 32m
    memswap_limit: 32m
    pids_limit: 32

networks:
  door:
    external: true
    name: parenting-agent_door
