# WhatsApp's door, apart from the Alexa skill's. It sits only on the door network, which the relay refuses on its Home Assistant and
# Baby Buddy ports. Cloudflare's tunnel hands it requests with no Access in front, since Meta and Twilio can't send a service token. One path,
# to the relay, and only a body signed with the app secret counts, which the agent checks.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 64; }

http {
  access_log off;
  server_tokens off;
  client_max_body_size 64k;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  resolver 127.0.0.11 valid=10s ipv6=off;

  proxy_http_version 1.1;
  proxy_set_header X-Forwarded-For "";
  proxy_read_timeout 30s;

  server {
    listen 8080;
    location = /whatsapp {
      limit_except GET POST { deny all; }
      set $relay parenting-agent-relay:8767;
      proxy_set_header Host relay;
      proxy_set_header Connection "";
      proxy_set_header Cookie "";
      proxy_pass http://$relay;
    }
    location ~ ^/twilio(/status)?$ {
      limit_except POST { deny all; }
      set $relay parenting-agent-relay:8767;
      proxy_set_header Host relay;
      proxy_set_header Connection "";
      proxy_set_header Cookie "";
      proxy_pass http://$relay;
    }
    location / {
      return 404;
    }
  }
}
