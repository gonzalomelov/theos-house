# Parenting agent for invited families, for the Vostro. NOT deployed yet: see docs/families.md.
#
#   docker network create --internal --ipv6=false \
#     -o com.docker.network.bridge.gateway_mode_ipv4=isolated pa-families-internal
#   docker compose --env-file ~/apps/pa-families.env -f deploy/families/compose.yml up -d --build
#
# The wall: `families` sits only on an internal network with no gateway and no host address. Its one way out is
# the egress proxy, which allows HTTPS CONNECT only to the brain and api.telegram.org (egress/filter). Nothing is
# published, the bot long-polls Telegram. It never joins babybuddy-net, home-assistant_default or the family
# agent's network, and the env file holds only the brain key and TELEGRAM_FAMILIES_BOT_TOKEN. No host networking.
name: pa-families

x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "3" }

services:
  families:
    <<: *hardened
    image: pa-families:latest
    build:
      context: ../..
      dockerfile: deploy/families/Dockerfile
    container_name: pa-families
    networks: [internal]
    depends_on: [egress]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in the env file}
      TELEGRAM_FAMILIES_BOT_TOKEN: ${TELEGRAM_FAMILIES_BOT_TOKEN:?set TELEGRAM_FAMILIES_BOT_TOKEN in the env file}
      PA_FAMILIES_BRAIN: ${PA_FAMILIES_BRAIN:-claude}
      PA_FAMILIES_BOT_USERNAME: ${PA_FAMILIES_BOT_USERNAME:-}
      PA_FAMILIES_INTERNAL_USERS: ${PA_FAMILIES_INTERNAL_USERS:-}
      PA_FAMILIES_DAILY_USD: ${PA_FAMILIES_DAILY_USD:-3}
      PA_FAMILIES_FAMILY_USD: ${PA_FAMILIES_FAMILY_USD:-0.5}
      HTTPS_PROXY: http://egress:8888
      NO_PROXY: localhost,127.0.0.1
    volumes:
      - ${PA_FAMILIES_DATA:-${HOME}/apps/pa-families-data}:/data
    tmpfs: ["/tmp:rw,size=16m"]
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 64

  egress:
    <<: *hardened
    image: pa-families-egress:latest
    build: { context: ./egress }
    container_name: pa-families-egress
    networks: [internal, egress]
    tmpfs: ["/tmp:rw,size=8m", "/run/tinyproxy:rw,size=1m,uid=100,gid=101"]
    mem_limit: 64m
    pids_limit: 64

networks:
  internal:
    external: true
    name: pa-families-internal
  egress:
    driver: bridge
