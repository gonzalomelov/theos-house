# The Alexa skill's door (issue #177). Cloudflare Access checks the skill's service token, cloudflared checks the
# Access token again and hands the request to 127.0.0.1:4830, this container. It forwards two paths to the relay's
# voice bridge port and nothing else. It sits only on the door network, with the relay: no Home Assistant, no Baby
# Buddy, no agent network. The relay refuses this network on its Home Assistant and Baby Buddy ports too.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 64; }

http {
  access_log off;
  server_tokens off;
  client_max_body_size 4k;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  resolver 127.0.0.11 valid=10s ipv6=off;

  proxy_http_version 1.1;
  proxy_set_header X-Forwarded-For "";
  proxy_read_timeout 60s;

  server {
    listen 8080;
    location ~ ^/(ask|health)$ {
      limit_except GET POST { deny all; }
      set $relay parenting-agent-relay:8767;
      proxy_set_header Host relay;
      proxy_set_header Connection "";
      # Cloudflare's own headers stay at the door: the bridge needs only the bearer token.
      proxy_set_header Cf-Access-Jwt-Assertion "";
      proxy_set_header Cookie "";
      proxy_pass http://$relay;
    }
    location / {
      return 404;
    }
  }
}
